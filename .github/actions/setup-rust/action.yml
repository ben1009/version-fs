name: Set up Rust
description: Install the repository's pinned toolchain (or an explicit rolling override) and cache Cargo output
inputs:
  toolchain:
    description: Optional override for rolling compatibility checks
    default: ""
  components:
    description: Additional rustup components
    default: ""
runs:
  using: composite
  steps:
    - name: Read pinned toolchain
      id: pinned
      shell: bash
      run: |
        python3 -c 'import tomllib; print("channel=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ inputs.toolchain || steps.pinned.outputs.channel }}
        components: ${{ inputs.components }}
    - name: Cache Rust build output
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
