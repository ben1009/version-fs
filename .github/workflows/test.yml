name: Test
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest@0.9.145
      # Empty suites are reported explicitly during workspace bootstrapping.
      - name: Unit tests
        if: matrix.suite == 'unit'
        run: cargo nextest run --locked --workspace --all-features --lib --no-tests=warn
      - name: Binary and integration tests
        if: matrix.suite == 'integration'
        run: cargo nextest run --locked --workspace --all-features --lib --bins --tests -E 'not kind(lib)' --test-threads 2 --no-tests=warn
      - name: Documentation tests
        if: matrix.suite == 'unit'
        run: cargo test --locked --workspace --all-features --doc

  rustfs-s3-conformance:
    name: RustFS S3 conformance
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: versionfs-local-access
      AWS_SECRET_ACCESS_KEY: versionfs-local-secret-change-me
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      VERSIONFS_S3_EMULATOR_ENDPOINT: http://127.0.0.1:9000
      VERSIONFS_S3_CONFORMANCE_BUCKET: versionfs-test-local
      VERSIONFS_S3_CONFORMANCE_PREFIX: versionfs-conformance/ci
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Start RustFS
        run: |
          docker run -d --name rustfs \
            -p 127.0.0.1:9000:9000 \
            -e RUSTFS_ACCESS_KEY="$AWS_ACCESS_KEY_ID" \
            -e RUSTFS_SECRET_KEY="$AWS_SECRET_ACCESS_KEY" \
            -e RUSTFS_ADDRESS=:9000 \
            rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b \
            /data
      - name: Install AWS CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/awscli"
          "$RUNNER_TEMP/awscli/bin/pip" install 'awscli==1.46.2'
          echo "$RUNNER_TEMP/awscli/bin" >> "$GITHUB_PATH"
      - name: Wait for RustFS and create test bucket
        run: |
          ready=false
          for attempt in $(seq 1 30); do
            if aws --endpoint-url "$VERSIONFS_S3_EMULATOR_ENDPOINT" \
              --region "$AWS_REGION" s3api list-buckets >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs rustfs
            exit 1
          fi
          aws --endpoint-url "$VERSIONFS_S3_EMULATOR_ENDPOINT" \
            --region "$AWS_REGION" s3api create-bucket \
            --bucket "$VERSIONFS_S3_CONFORMANCE_BUCKET"
      - name: Run S3 conformance test
        run: |
          cargo test --locked -p versionfs-service \
            --features s3-emulator --test s3_conformance -- \
            --ignored --nocapture
      - name: Remove RustFS container
        if: always()
        run: docker rm -f rustfs || true

  coverage:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - name: Install coverage tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest@0.9.145,cargo-llvm-cov@0.9.0
      - name: Generate coverage
        run: bash scripts/coverage.sh --lcov --output-path lcov.info
      - name: Summarize coverage
        if: hashFiles('lcov.info') != ''
        shell: bash
        run: python3 scripts/coverage_summary.py lcov.info | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Explain skipped Codecov upload
        if: hashFiles('lcov.info') != '' && env.CODECOV_TOKEN == ''
        run: |
          echo "::warning title=Codecov upload skipped::Set the repository Actions secret CODECOV_TOKEN to enable Codecov uploads."
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '> Codecov upload skipped: configure the `CODECOV_TOKEN` repository Actions secret.' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep coverage report
        if: hashFiles('lcov.info') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: lcov.info
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != '' && hashFiles('lcov.info') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
