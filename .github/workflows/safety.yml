name: Safety
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sanitizer:
    name: Linux (${{ matrix.sanitizer }} sanitizer)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, leak]
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
      ASAN_OPTIONS: detect_odr_violation=0:detect_leaks=0
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/lsan-suppressions.txt
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install sanitizer symbolizer
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm
      # Failpoints may be process-global; the regular nextest job isolates them.
      - name: Sanitized tests
        run: cargo test --locked --workspace --all-features --lib --tests --target x86_64-unknown-linux-gnu -- --skip failpoint --test-threads=2
