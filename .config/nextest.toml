[profile.default]
slow-timeout = { period = "10s", terminate-after = 3, grace-period = "3s" }
retries = { backoff = "exponential", count = 3, delay = "1s", jitter = true }
test-threads = "num-cpus"

# Failure-injection tests must fail deterministically rather than pass on retry.
[[profile.default.overrides]]
filter = 'test(failpoint_) | test(chaos_)'
slow-timeout = { period = "2m", terminate-after = 1, grace-period = "10s" }
retries = 0

[profile.coverage]
slow-timeout = { period = "30s", terminate-after = 3, grace-period = "5s" }
retries = { backoff = "exponential", count = 3, delay = "1s", jitter = true }
test-threads = "num-cpus"

[profile.all-targets]
retries = { backoff = "exponential", count = 3, delay = "1s", jitter = true }
test-threads = "num-cpus"

[[profile.all-targets.overrides]]
filter = 'kind(bench)'
test-group = 'bench-serial'
slow-timeout = { period = "10m", terminate-after = 1, grace-period = "10s" }
retries = 0

[test-groups.bench-serial]
max-threads = 1
