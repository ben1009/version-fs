[package]
name = "versionfs-service"
description = "Version FS object-store adapters, metadata authority, and service"
version.workspace = true
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "=0.1.89"
futures-util = "=0.3.33"
object_store = { version = "=0.13.2", default-features = false, features = ["aws", "tls-webpki-roots"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
versionfs-core = { path = "../versionfs-core" }

