[package]
name = "versionfs-sdk"
description = "Version FS client transport, Linux worker integration, and capture coordination"
version.workspace = true
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "versionfs-ublk-smoke"
path = "src/bin/ublk-smoke.rs"
required-features = ["ublk-smoke"]

[features]
default = []
ublk-smoke = ["dep:ctrlc", "dep:libc", "dep:libublk"]
ublk-adapter = ["dep:libc", "dep:libublk"]

[dependencies]
getrandom = "=0.4.3"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
versionfs-core = { path = "../versionfs-core" }

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "=3.5.2", features = ["termination"], optional = true }
libc = { version = "=0.2.191", optional = true }
libublk = { version = "=0.4.8", optional = true }

[lints]
workspace = true
